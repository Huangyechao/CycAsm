[package]
name = "thPolish"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
chrono = "0.4.44"
clap = {version = "4.5", features = ["derive"]}
crossbeam-channel = "0.5.15"
ctor = "0.6.3"
lazy_static = "1.5.0"
libc = "0.2.183"
libc-stdhandle = "0.1.0"
log = "0.4.29"
mimalloc = "0.1.48"
ndarray = { version = "0.17", features = ["serde"] }
path-absolutize = "3.1.1"
rayon = "1.11.0"

rmp-serde = "1.3.1" 
rmpv = "1.3.1"

rust-htslib = "1.0.0"
rustc-hash = "2.1.2"
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tch = "0.23.0"
ureq = "2.12"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zstd = "0.13.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
